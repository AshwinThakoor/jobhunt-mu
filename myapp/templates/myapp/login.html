{% extends 'myapp/base.html' %}
{% block title %}Log in | JobHunt MU{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="container">
        <div class="auth-card mx-auto" style="max-width: 500px;">
            <span class="eyebrow text-success"><i class="bi bi-person-check"></i> Welcome back</span>
            <h1 class="h2 mb-2">Continue your career search</h1>
            <p class="text-muted mb-4">Log in to manage applications, CVs and recommendations.</p>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-brand w-100">Log in</button>
            </form>
            <p class="text-center text-muted small mt-4 mb-0">New to JobHunt MU? <a href="{% url 'signup' %}">Create an account</a></p>
        </div>
    </div>
</section>
{% endblock %}
