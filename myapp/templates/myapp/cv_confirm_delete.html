{% extends 'myapp/base.html' %}
{% block title %}Delete CV | JobHunt MU{% endblock %}
{% block content %}
<div class="container py-4">
    <h2>Delete CV</h2>
    <div class="alert alert-danger">
        Are you sure you want to delete the CV "{{ cv.title }}"?
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'cv_list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
