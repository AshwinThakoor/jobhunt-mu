{% extends 'myapp/base.html' %}
{% block title %}Withdraw Application | JobHunt MU{% endblock %}
{% block content %}
<div class="container py-4">
    <h2>Withdraw Application</h2>
    <div class="alert alert-warning">
        Are you sure you want to withdraw your application for "{{ application.internship.title }}"?
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Withdraw</button>
        <a href="{% url 'application_list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
