{% extends 'myapp/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Post Internship | JobHunt MU{% endblock %}
{% block content %}
<div class="container py-4">
    <h2>Post New Internship</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Post Internship</button>
        <a href="{% url 'employer_dashboard' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
